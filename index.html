                this.setStatus(`Switching lens (${this.currentCamIndex + 1}/${this.allCameras.length})...`, true);
                await this.stopCamera();
                setTimeout(() => this.startCameraFlow(), 150);
            }

            async start() {
                this.modal.classList.remove('opacity-0', 'pointer-events-none');
                this.modal.classList.add('opacity-100', 'pointer-events-auto');
                this.resetScanUI();
                this.isProcessing = false;
                this.flashOn = false;
                this.updateFlashUI();
                await this.startCameraFlow();
            }

            async startCameraFlow() {
                if (this.stopPromise) await this.stopPromise;
                if (this.html5Qrcode && this.isScanning) return;

                this.setStatus('Starting camera...', true);

                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    this.setStatus('Camera not supported on this browser.', true);
                    return;
                }
                if (typeof Html5Qrcode === 'undefined') {
                    window.showToast('Scanner library failed to load.');
                    this.stop();
                    return;
                }

                if (!this.html5Qrcode) {
                    try { this.html5Qrcode = new Html5Qrcode('scanner-reader', { verbose: false }); }
                    catch (e) { this.setStatus('Scanner library error.', true); return; }
                }

                if (this.allCameras.length > 0 && this.currentCamIndex >= 0) {
                    this.startCamera(this.allCameras[this.currentCamIndex].id);
                    return;
                }

                try {
                    const devices = await Html5Qrcode.getCameras();
                    if (devices && devices.length) {
                        this.allCameras = devices;
                        const switchBtn = document.getElementById('btn-switch-cam');
                        if (this.allCameras.length > 1) { switchBtn.style.opacity = '1'; switchBtn.style.pointerEvents = 'auto'; }
                        else { switchBtn.style.opacity = '0.5'; switchBtn.style.pointerEvents = 'none'; }

                        const backCam = this.allCameras.find(d => /back|rear|environment/i.test(d.label || ''));
                        if (backCam) { this.currentCamIndex = this.allCameras.indexOf(backCam); this.startCamera(backCam.id); }
                        else { this.currentCamIndex = 0; this.startCamera(this.allCameras[0].id); }
                    } else {
                        this.setStatus('No cameras found.', true);
                    }
                } catch (err) {
                    XanLogger.error('Camera enumeration failed', err);
                    this.setStatus('Camera permission denied.', true);
                }
            }

            startCamera(cameraId) {
                const formats = [
                    Html5QrcodeSupportedFormats.QR_CODE, Html5QrcodeSupportedFormats.AZTEC,
                    Html5QrcodeSupportedFormats.DATA_MATRIX, Html5QrcodeSupportedFormats.PDF_417,
                    Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.CODE_39,
                    Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.UPC_A
                ];

                const onDecode = (decodedText, decodedResult) => {
                    if (this.isProcessing) return;
                    this.isProcessing = true;
                    let formatName = 'QR_CODE';
                    try { formatName = decodedResult?.result?.format?.formatName || formatName; } catch(e) {}
                    this.handleSuccess(decodedText, formatName);
                };
                const onError = () => {};

                const tryStart = (videoConstraints) => this.html5Qrcode.start(
                    cameraId,
                    { fps: 15, disableFlip: false, formatsToSupport: formats, videoConstraints },
                    onDecode, onError
                );

                tryStart({ deviceId: { exact: cameraId }, width: { ideal: 3840 }, height: { ideal: 2160 }, focusMode: "continuous" })
                    .then(() => this.onCameraStarted())
                    .catch(() => {
                        tryStart({ deviceId: { exact: cameraId }, width: { ideal: 1920, min: 1280 }, height: { ideal: 1080, min: 720 }, focusMode: "continuous" })
                            .then(() => this.onCameraStarted())
                            .catch((err) => {
                                XanLogger.error('Camera start failed', err);
                                this.setStatus('Camera initialization failed.', true);
                                this.isSwitchingLens = false;
                            });
                    });
            }

            onCameraStarted() {
                this.isScanning = true;
                this.isSwitchingLens = false;
                this.setStatus('', false);
                if (this.allCameras.length > 1) {
                    const switchBtn = document.getElementById('btn-switch-cam');
                    switchBtn.style.opacity = '1'; switchBtn.style.pointerEvents = 'auto';
                }
                setTimeout(async () => {
                    if (!this.isScanning || !this.html5Qrcode) return;
                    try {
                        const caps = this.html5Qrcode.getRunningTrackCapabilities();
                        const advanced = [];
                        if (caps && caps.zoom) advanced.push({ zoom: 1.0 });
                        if (caps && caps.focusDistance) advanced.push({ focusDistance: 1 });
                        if (advanced.length) await this.html5Qrcode.applyVideoConstraints({ advanced });
                    } catch (e) {}
                }, 500);
            }

            async stopCamera() {
                if (!this.html5Qrcode) return;
                this.isScanning = false;
                this.flashOn = false;
                this.updateFlashUI();
                const inst = this.html5Qrcode;
                this.html5Qrcode = null;
                this.stopPromise = inst.stop()
                    .then(() => { try { inst.clear(); } catch(e) {} this.stopPromise = null; })
                    .catch(() => { this.stopPromise = null; });
                await this.stopPromise;
            }

            resetScanUI() {
                document.getElementById('scanner-cutout').classList.remove('scanner-frame-active');
                document.getElementById('scanner-laser').classList.remove('hidden');

                for(let i=1; i<=4; i++) {
                    document.getElementById(`corner-${i}`).classList.replace('border-green-400', 'border-white/90');
                }

                this.sheet.classList.add('translate-y-full');
            }

            resetScan() {
                this.isProcessing = false;
                this.currentResult = null;
                this.currentFormat = null;
                this.resetScanUI();
                this.startCameraFlow();
            }

            handleSuccess(data, format) {
                if(navigator.vibrate) navigator.vibrate([40, 60, 40]);

                this.stopCamera();
                this.currentResult = data;

                document.getElementById('scanner-cutout').classList.add('scanner-frame-active');
                document.getElementById('scanner-laser').classList.add('hidden');

                for(let i=1; i<=4; i++) {
                    document.getElementById(`corner-${i}`).classList.replace('border-white/90', 'border-green-400');
                }

                let bcid = 'qrcode';
                let formatDisplay = 'QR Code';
                const f = (format || '').toUpperCase();
                if (f === 'CODE_128') { bcid = 'code128'; formatDisplay = 'Code 128'; }
                if (f === 'CODE_39') { bcid = 'code128'; formatDisplay = 'Code 39'; }
                if (f === 'DATA_MATRIX') { bcid = 'datamatrix'; formatDisplay = 'Data Matrix'; }
                if (f === 'PDF_417') { bcid = 'pdf417'; formatDisplay = 'PDF417'; }
                if (f === 'AZTEC') { bcid = 'azteccode'; formatDisplay = 'Aztec Code'; }
                if (f === 'EAN_13' || f === 'UPC_A') { bcid = 'code128'; formatDisplay = 'Product Barcode'; }

                this.currentFormat = bcid;
                
                // Smart Data Parsing Engine
                let parsedType = 'TEXT';
                let actionText = 'Save';
                let actionIcon = 'save';
                let actionCallback = () => {
                    this.stop();
                    window.CodeGenerator.open(this.currentResult, this.currentFormat);
                };

                const urlRegex = /^(https?:\/\/)?([\da-z\.-]+)\.([a-z\.]{2,6})([\/\w \.-]*)*\/?$/;
                if (urlRegex.test(data)) {
                    parsedType = 'WEBSITE';
                    actionText = 'Open Link';
                    actionIcon = 'external-link';
                    actionCallback = () => {
                        let link = data;
                        if (!link.startsWith('http://') && !link.startsWith('https://')) link = 'https://' + link;
                        window.open(link, '_blank');
                        this.stop();
                    };
                }
                
                if (data.startsWith('WIFI:')) {
                    parsedType = 'WI-FI NETWORK';
                    actionText = 'Copy Password';
                    actionIcon = 'wifi';
                    actionCallback = () => {
                        const passMatch = data.match(/P:(.*?);/);
                        if (passMatch && passMatch[1]) {
                            let textArea = document.createElement("textarea");
                            textArea.value = passMatch[1];
                            textArea.style.position = "fixed"; textArea.style.left = "-999999px";
                            document.body.appendChild(textArea);
                            textArea.focus(); textArea.select();
                            try { document.execCommand('copy'); window.showToast('Password Copied!'); } catch(e){}
                            textArea.remove();
                        } else {
                            window.showToast('No password found in code.');
                        }
                    };
                }

                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (emailRegex.test(data) || data.toLowerCase().startsWith('mailto:')) {
                    parsedType = 'EMAIL ADDRESS';
                    actionText = 'Send Email';
                    actionIcon = 'mail';
                    actionCallback = () => {
                        let mailto = data.toLowerCase().startsWith('mailto:') ? data : `mailto:${data}`;
                        window.location.href = mailto;
                        this.stop();
                    };
                }

                if (data.toLowerCase().startsWith('tel:')) {
                    parsedType = 'PHONE NUMBER';
                    actionText = 'Call Number';
                    actionIcon = 'phone';
                    actionCallback = () => {
                        window.location.href = data;
                        this.stop();
                    };
                }

                this.formatLabel.innerHTML = `${formatDisplay} <span class="text-blue-500 font-black text-xs ml-2 uppercase tracking-widest bg-blue-100 px-2 py-0.5 rounded-md">${parsedType}</span>`;
                this.dataView.innerText = data;
                
                this.actionBtn.innerHTML = `<i data-lucide="${actionIcon}" class="w-4 h-4 inline-block mr-1"></i> ${actionText}`;
                
                const newBtn = this.actionBtn.cloneNode(true);
                this.actionBtn.parentNode.replaceChild(newBtn, this.actionBtn);
                this.actionBtn = newBtn; 
                this.actionBtn.addEventListener('click', actionCallback);
                safeCreateIcons();

                setTimeout(() => {
                    this.sheet.classList.remove('translate-y-full');
                }, 300);
            }

            async stop() {
                this.isProcessing = false;
                this._wasInterrupted = false;
                await this.stopCamera();
                this.modal.classList.add('opacity-0', 'pointer-events-none');
                this.modal.classList.remove('opacity-100', 'pointer-events-auto');
                this.sheet.classList.add('translate-y-full');
            }
        }

        class OSSettingsManager {
            constructor() {
                this.modal = document.getElementById('settings-modal');
                this.panel = document.getElementById('settings-panel');
                this.gridButtons = document.querySelectorAll('.grid-select-btn');
                this.autoArrangeToggle = document.getElementById('auto-arrange-toggle');
                this.wallpaperInput = document.getElementById('wallpaper-upload');
                this.resetWallpaperBtn = document.getElementById('btn-reset-wallpaper');

                document.getElementById('btn-open-settings').addEventListener('click', () => this.open());
                document.getElementById('btn-close-settings').addEventListener('click', () => this.close());
                this.modal.addEventListener('click', (e) => { if (e.target === this.modal) this.close(); });

                this.gridButtons.forEach(btn => {
                    btn.addEventListener('click', () => this.setGridSize(btn.dataset.grid));
                });

                this.autoArrangeToggle.checked = !!window.OS_STATE.autoArrange;
                this.autoArrangeToggle.addEventListener('change', (e) => {
                    window.OS_STATE.autoArrange = e.target.checked;
                    saveState();
                    if (navigator.vibrate) navigator.vibrate(10);
                    window.Renderer.render();
                });

                this.wallpaperInput.addEventListener('change', (e) => this.handleWallpaperUpload(e));
                this.resetWallpaperBtn.addEventListener('click', () => this.resetWallpaper());

                this.syncGridButtonsUI();
            }

            open() {
                this.syncGridButtonsUI();
                this.modal.classList.remove('opacity-0', 'pointer-events-none');
                this.modal.classList.add('opacity-100', 'pointer-events-auto');
                this.panel.classList.remove('scale-90');
                this.panel.classList.add('scale-100');
            }

            close() {
                this.modal.classList.add('opacity-0', 'pointer-events-none');
                this.modal.classList.remove('opacity-100', 'pointer-events-auto');
                this.panel.classList.add('scale-90');
                this.panel.classList.remove('scale-100');
            }

            syncGridButtonsUI() {
                this.gridButtons.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.grid === window.OS_STATE.gridSize);
                });
            }

            setGridSize(size) {
                if (window.OS_STATE.gridSize === size) return;
                window.OS_STATE.gridSize = size;
                saveState();
                this.syncGridButtonsUI();
                if (navigator.vibrate) navigator.vibrate(10);
                window.Layout.calculateGrid();
            }

            handleWallpaperUpload(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    const dataUrl = evt.target.result;
                    window.OS_STATE.wallpaper = dataUrl;
                    try {
                        saveState();
                    } catch (err) {
                        window.OS_STATE.wallpaper = null;
                        window.showToast('Image too large to save.');
                        return;
                    }
                    document.body.style.backgroundImage = `url('${dataUrl}')`;
                    this.resetWallpaperBtn.classList.remove('hidden');
                    window.showToast('Wallpaper updated!');
                };
                reader.onerror = () => window.showToast('Failed to read image.');
                reader.readAsDataURL(file);
                e.target.value = '';
            }

            resetWallpaper() {
                window.OS_STATE.wallpaper = null;
                saveState();
                document.body.style.backgroundImage = '';
                this.resetWallpaperBtn.classList.add('hidden');
                window.showToast('Wallpaper reset.');
            }
        }

        // --- INIT ---
        window.TimeEngine = new OSTimeEngine();
        window.Renderer = new OSRenderer();
        window.DragEngine = new PhysicsDragEngine();
        window.SearchEngine = new OSSearchEngine();
        window.GestureManager = new OSGestureManager();
        window.InteractionManager = new OSInteractionManager();
        window.CodeGenerator = new OSCodeGenerator();
        window.ScannerEngine = new OSScannerEngine();
        window.SettingsManager = new OSSettingsManager();
        window.Layout = new LayoutManager(window.Renderer);

        const pager = document.getElementById('workspace-pager');
        pager.addEventListener('scroll', () => {
            const clientWidth = pager.clientWidth;
            if (clientWidth === 0) return;
            const pageIndex = Math.round(pager.scrollLeft / clientWidth);
            if (pageIndex !== window.OS_STATE.currentPage) {
                window.OS_STATE.currentPage = pageIndex;
                window.Renderer.updatePagination(pageIndex);
            }
        }, { passive: true });

        let pressTimer;
        const startPress = (e) => {
            if (window.OS_STATE.isEditMode || e.target.closest('button') || !e.target.closest('.app-icon-wrapper')) return;
            pressTimer = setTimeout(() => {
                window.OS_STATE.isEditMode = true;
                document.body.classList.add('edit-mode');
                if (navigator.vibrate) navigator.vibrate([10, 30, 10]);
                window.Renderer.render(); 
            }, 600);
        };
        const cancelPress = () => clearTimeout(pressTimer);
        
        pager.addEventListener('touchstart', startPress, { passive: true });
        pager.addEventListener('mousedown', startPress);
        pager.addEventListener('touchend', cancelPress);
        pager.addEventListener('touchmove', cancelPress, { passive: true });
        pager.addEventListener('mouseup', cancelPress);
        pager.addEventListener('mouseleave', cancelPress);

        pager.addEventListener('click', (e) => {
            if (window.OS_STATE.isEditMode && !e.target.closest('.app-icon-wrapper')) {
                window.OS_STATE.isEditMode = false;
                document.body.classList.remove('edit-mode');
                const jiggles = document.querySelectorAll('.jiggle-target');
                jiggles.forEach(j => j.style.animation = 'none');
                
                window.DragEngine.destroy();
                setTimeout(() => { window.Renderer.render(); }, 400);
            }
        });
    </script>
</body>
